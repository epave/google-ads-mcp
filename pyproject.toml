[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "MCP server to read and manage Google Ads campaigns from Claude Code, Codex, and other agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pavel Erofeev" }]
dependencies = [
    "fastmcp>=4.0.3",
    "google-ads>=32.0.0",
    "google-auth-oauthlib>=1.4.1",
    "pydantic-settings>=2.15.0",
    "duckdb>=2.0.0.dev0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.16.0",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"
google-ads-mcp-auth = "google_ads_mcp.auth:main"
google-ads-mcp-harness = "google_ads_mcp.harness:main"
google-ads-mcp-smoke = "google_ads_mcp.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/google_ads_mcp" = "google_ads_mcp"

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
