[project]
name = "google-ads-mcp"
version = "0.1.0"
description = "MCP server to read and manage Google Ads campaigns from Claude Code, Codex, and other agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pavel Erofeev" }]
dependencies = [
    "fastmcp>=2.13.0",
    "google-ads>=28.0.0",
    "google-auth-oauthlib>=1.2.0",
    "pydantic-settings>=2.10.0",
    "duckdb>=1.6.0.dev0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.server:main"
google-ads-mcp-auth = "google_ads_mcp.auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_ads_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/google_ads_mcp" = "google_ads_mcp"

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
