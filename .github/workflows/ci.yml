name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --prerelease=allow
      - name: Lint
        run: uv run ruff check src tests
      - name: Tests
        run: uv run pytest -q
      - name: Review harness until convergence
        run: uv run google-ads-mcp-harness --max-rounds 3 --fix --output harness-report.json
      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-report
          path: harness-report.json
