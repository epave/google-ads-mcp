name: review-open-prs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev --prerelease=allow
      - name: Review all open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run google-ads-mcp-harness --all-open --max-rounds 3 --output harness-open-prs.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-open-prs
          path: harness-open-prs.json
